<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan zajęć 245IC – Informatyka, rok III</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fafaf8;--tx:#1d2330;--mut:#5b6474;--ln:#b9bec8;--hd:#e3e5ea;
--m9:#ece7f5;--m10:#fbe9c6;--m11:#e2e7ee;--m12:#dff0e4;--m1:#f8e1e1;--m2:#dcedf3;--m3:#e6f0d6;--m4:#f3ecd0;--m5:#dff2e6;--m6:#fae3d2;--m7:#efdff1;--m8:#d8ecf0;
--os:#9fd3e0;--oz:#ecc3d6;--bsp:#ee8d99;--ozo:#66e0bb;--hsk:#f2b08f;--pao:#86b9ad;--ja:#d2cf8f;--sp:#f5d9de}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--tx:#e8eaf0;--mut:#a3abba;--ln:#3a414f;--hd:#262b36;
--m9:#2b2640;--m10:#3a3220;--m11:#272c36;--m12:#1f3326;--m1:#3a2326;--m2:#1f3238;--m3:#2a3320;--m4:#38341f;--m5:#1f3427;--m6:#3a2b20;--m7:#32233a;--m8:#1f3238}}
:root[data-theme="dark"]{--bg:#14171d;--tx:#e8eaf0;--mut:#a3abba;--ln:#3a414f;--hd:#262b36;
--m9:#2b2640;--m10:#3a3220;--m11:#272c36;--m12:#1f3326;--m1:#3a2326;--m2:#1f3238;--m3:#2a3320;--m4:#38341f;--m5:#1f3427;--m6:#3a2b20;--m7:#32233a;--m8:#1f3238}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 "Segoe UI",system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border:1px solid var(--ln);display:inline-block}
.wrap{overflow-x:auto;max-width:100%;border:1px solid var(--ln)}
.day{display:grid;grid-template-columns:36px 118px repeat(var(--n),var(--cw));grid-auto-rows:var(--rh);width:max-content;--cw:64px;--rh:36px;border-bottom:3px solid var(--ln)}
.day>*{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);min-width:0;min-height:0}
.dl{grid-column:1;background:var(--hd);display:flex;align-items:center;justify-content:center;font-weight:700;position:sticky;left:0;z-index:3}
.dl span{writing-mode:vertical-rl;transform:rotate(180deg)}
.hr{grid-column:2;background:var(--hd);display:flex;gap:6px;align-items:center;padding:0 6px;position:sticky;left:36px;z-index:3;font-size:12px}
.hr b{width:18px;text-align:right}
.hr em{font-style:normal;color:var(--mut);font-size:11px}
.dh{background:var(--hd);text-align:center;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600}
.c{opacity:1}
.ev{z-index:2;padding:2px 3px;font-size:10px;line-height:1.2;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;border:1px solid rgba(0,0,0,.45);color:#111}
.ev b{font-size:11px}
.ev small{font-size:9.5px;opacity:.85}
.Os{background:var(--os)}.Oz{background:var(--oz)}.Bsp1{background:var(--bsp)}.Ozo{background:var(--ozo)}.Hsk{background:var(--hsk)}.Pao1{background:var(--pao)}.Ja{background:var(--ja)}.SPOTKANIE{background:var(--sp)}
#tabs{display:none;gap:6px;margin:0 0 8px}
#tabs button{flex:1;padding:10px 0;border:1px solid var(--ln);background:var(--hd);color:var(--tx);font:inherit;font-weight:600;border-radius:8px}
#tabs button[aria-selected=true]{background:var(--tx);color:var(--bg)}
details{margin:0 0 8px}summary{cursor:pointer;font-weight:600;padding:4px 0}
.dh{position:sticky;top:0;z-index:4}
.dh.today{background:#e11d48;color:#fff}
.tdy{z-index:3;border:2px solid #e11d48;background:rgba(225,29,72,.08);pointer-events:none}
.src{color:var(--mut);font-size:12px;margin:8px 0 0}.src a{color:inherit}
#det{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:10px;white-space:pre-line;z-index:20;display:none;font-size:14px;line-height:1.45}
.ev{cursor:pointer}
.dn{display:none}
.chg{outline:2px dashed #e11d48;outline-offset:-3px}
.chgsw{border:2px dashed #e11d48!important}
@media (max-width:700px){
body{padding:8px}h1{font-size:17px}.sub{display:none}
#tabs{display:flex}
.day:not(.on){display:none}
.wrap{max-height:calc(100dvh - 130px);overflow:auto;border-radius:8px}
.day{grid-template-columns:0 68px repeat(var(--n),var(--cw));--cw:46px;--rh:36px}
.dl{display:none}
.hr{left:0;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:0 6px}
.hr{padding:0 3px}.hr b{width:auto;font-size:11px;line-height:1}.hr em{font-size:9.5px;line-height:1;white-space:nowrap}
.hr{z-index:5}
.dh{font-size:10.5px;top:0;line-height:1}
.ev{padding:1px}.ev b{font-size:var(--fs,10px);line-height:1.1;word-break:break-all}.ev small{display:none}.ev span{font-size:calc(var(--fs,10px) - 1px)}#plan.sm .ev span{display:none}#tabs .sz{flex:0 0 44px}#tabs{gap:4px}#tabs .sz{flex:0 0 34px}#tabs .allb{flex:0 0 58px;font-size:12px}#plan.all .dn{display:inline;font-weight:700;font-size:12px}#plan.all .g{display:none}
}
@media print{body{padding:0}.wrap{overflow:visible}}
</style>
</head>
<body>
<h1>Plan zajęć 245IC – Informatyka, rok III</h1>
<p class="sub">Egzaminy: J. angielski, Systemy operacyjne, Bazy danych, Bezp. sys. informatycznych. Najedź na zajęcia, żeby zobaczyć pełny opis.</p>
<nav id="tabs" role="tablist"></nav>
<details id="lg"><summary>Legenda</summary><div class="legend" id="leg"></div></details>
<div class="wrap" id="plan"></div>
<p class="src">Dane z planu AMW (stan z __UPD__). <a href="https://www.wme.amw.gdynia.pl/xml/245IC_.htm" target="_blank" rel="noopener">Otwórz aktualny plan na stronie uczelni</a></p>
<div id="det"></div>
<script>
const META=__META__;
const SUBJ=Object.fromEntries(Object.entries(META.subj).map(([k,v])=>[k,v.n]));
const T=["08:10–08:55","09:00–09:45","09:55–10:40","10:45–11:30","11:40–12:25","12:30–13:15","13:25–14:10","14:15–15:00","15:10–15:55","16:05–16:50","16:55–17:40","17:45–18:30",""];
const MN=["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];
const DAYS=["pon.","wt.","śr.","czw.","pt."],NW=META.dates.map(a=>a.length),NR=META.nr;
// [dzień,tydz od,tydz do,wiersz od,wiersz do,kod,prowadzący,sala,grupa]
const A="TrPa",K="KaBa",B="BłMa",H="BiKr",L="ŁuB",Z="ŻaAn";
const E=__EVENTS__;
const NAMES=META.names;
const nm=c=>{const k=Object.keys(NAMES).find(k=>k===c||k.startsWith(c));return k?NAMES[k]:""};
const pl=["sty","lut","mar","kwi","maj","cze","lip","sie","wrz","paź","lis","gru"];
const base=new Date(META.dates[0][0]+"T00:00:00");
document.title=META.h1;document.querySelector("h1").textContent=META.h1;document.querySelector(".sub").textContent=(META.sub?META.sub+". ":"")+"Najedź na zajęcia, żeby zobaczyć pełny opis.";
const st=document.createElement("style");st.textContent=Object.entries(META.subj).map(([k,v])=>`.${CSS.escape(k)}{background:${v.c}}`).join("");document.head.appendChild(st);
const out=document.getElementById("plan"),now=new Date(),tg=new Date(now.getFullYear(),now.getMonth(),now.getDate());
if(tg.getDay()===0)tg.setDate(tg.getDate()+1);else if(tg.getDay()===6)tg.setDate(tg.getDate()+2);
const tk=tg.toDateString(),G=[];
DAYS.forEach((dn,d)=>{
  const n=NW[d],r=NR[d],g=document.createElement("div");
  g.className="day";G.push(g);g.style.setProperty("--n",n);
  const add=(cls,html,col,row,col2,row2,st)=>{const e=document.createElement("div");e.className=cls;e.innerHTML=html;
    e.style.gridColumn=col2?`${col} / ${col2}`:`${col}`;e.style.gridRow=row2?`${row} / ${row2}`:`${row}`;if(st)e.style.cssText+=st;g.appendChild(e);return e};
  add("dl","",1,1,null,r+2).appendChild(Object.assign(document.createElement("span"),{textContent:dn}));
  add("hr","",2,1);g.lastChild.style.justifyContent="center";g.lastChild.innerHTML=`<span class="g">godz.</span><span class="dn">${dn}</span>`;
  const dates=[];
  for(let w=0;w<n;w++){const dt=new Date(META.dates[d][w]+"T00:00:00");dates.push(dt);
    add("dh"+(dt.toDateString()===tk?" today":""),`${String(dt.getDate()).padStart(2,"0")}.${String(dt.getMonth()+1).padStart(2,"0")}`,3+w,1);}
  dates.forEach((dt,w)=>{if(dt.toDateString()===tk)add("tdy","",3+w,2,null,r+2)});
  for(let h=1;h<=r;h++){
    add("hr",`<b>${h}</b><em>${T[h-1]||""}</em>`,2,h+1);
    for(let w=0;w<n;w++){const m=dates[w].getMonth()+1;add("c","",3+w,h+1,null,null,`background:var(--m${m})`);}
  }
  E.filter(e=>e[0]===d).forEach(([,w1,w2,r1,r2,code,who,room,grp,note])=>{
    const key=code.split("(")[0],full=SUBJ[key]||code;
    const t=`${full} – ${code}\n${who?(nm(who)||who)+" • ":""}${room?"sala "+room+" • ":""}${grp}\n${dn} ${T[r1-1]?T[r1-1].slice(0,5):""}–${T[r2-1]?T[r2-1].slice(-5):""}`;
    const ev=add("ev "+key,`<b>${code}</b><span>${who}</span><small>${room}</small>`,3+w1,r1+1,3+w2+1,r2+2);
    ev.title=(note?"ZMIANA: "+note+"\n":"")+t;if(note)ev.classList.add("chg");
  });
  out.appendChild(g);
});
const leg=document.getElementById("leg");
[...new Set(META.dates.flat().map(s=>+s.slice(5,7)))].forEach(m=>leg.insertAdjacentHTML("beforeend",`<span><i style="background:var(--m${m})"></i>${MN[m-1]}</span>`));
Object.entries(SUBJ).forEach(([k,v])=>leg.insertAdjacentHTML("beforeend",`<span><i class="${k}"></i>${k} – ${v}</span>`));
if(E.some(e=>e[9]))leg.insertAdjacentHTML("beforeend",`<span><i class="chgsw"></i>ręczna zmiana planu</span>`);
Object.entries(NAMES).forEach(([k,v])=>leg.insertAdjacentHTML("beforeend",`<span>${k} – ${v}</span>`));

const tabs=document.getElementById("tabs"),det=document.getElementById("det");
let ALL=false,CUR=0;
function pick(i){CUR=i;out.classList.toggle("all",ALL);G.forEach((g,k)=>g.classList.toggle("on",ALL||k===i));[...tabs.children].forEach(b=>{const k=b.dataset.k;b.setAttribute("aria-selected",k==="all"?ALL:(k!==undefined&&!ALL&&+k===i))});
  const dh=G[i].querySelector(".dh.today")||G[i].querySelectorAll(".dh")[Math.max(0,Math.min(NW[i]-1,Math.floor(Math.round((tg-base)/864e5)/7)))];
  requestAnimationFrame(()=>{if(dh&&G[i].offsetParent)out.scrollLeft=Math.max(0,dh.getBoundingClientRect().left-out.getBoundingClientRect().left+out.scrollLeft-(innerWidth>700?160:76))});}
DAYS.forEach((n,i)=>{const b=document.createElement("button");b.textContent=n.replace(".","")+(i===tg.getDay()-1?" •":"");b.role="tab";b.dataset.k=i;b.onclick=()=>{ALL=false;pick(i)};tabs.appendChild(b)});
const ab=document.createElement("button");ab.textContent="Całość";ab.className="allb";ab.dataset.k="all";ab.setAttribute("aria-label","Pokaż cały plan");ab.onclick=()=>{ALL=!ALL;pick(CUR)};tabs.appendChild(ab);
const SZ=[[40,29,9],[46,36,10],[54,44,11],[62,52,12]];let zi=2;
function size(d){zi=Math.max(0,Math.min(3,zi+d));if(innerWidth>700)return;const[c,r,f]=SZ[zi];
  G.forEach(g=>{g.style.setProperty("--cw",c+"px");g.style.setProperty("--rh",r+"px")});
  out.style.setProperty("--fs",f+"px");out.classList.toggle("sm",zi===0);}
[["−",-1],["+",1]].forEach(([t,d])=>{const b=document.createElement("button");b.textContent=t;b.className="sz";b.setAttribute("aria-label",d<0?"Zmniejsz komórki":"Powiększ komórki");b.onclick=()=>{size(d);pick(CUR)};tabs.appendChild(b)});
size(0);
pick(tg.getDay()-1);
if(innerWidth>700)document.getElementById("lg").open=true;
out.addEventListener("click",e=>{const v=e.target.closest(".ev");if(!v){det.style.display="none";return}det.textContent=v.title;det.style.display="block"});
det.onclick=()=>det.style.display="none";
</script>
</body>
</html>
